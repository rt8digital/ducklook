name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build renderer and Electron bundles
        run: npm run build

      - name: Build and publish
        run: node scripts/electron-builder.mjs --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
