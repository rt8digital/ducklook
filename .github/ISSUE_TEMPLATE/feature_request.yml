name: Feature request
description: Suggest a focused improvement or new capability
title: 'feat: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Check the README roadmap and existing issues first. For large changes, describe the problem before prescribing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and where it breaks down today.
      placeholder: I triage a large inbox every morning and cannot...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should DuckLook do? A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Mail sync / protocols
        - Mail UI
        - Calendar
        - Contacts
        - Tasks
        - Settings / rules / signatures
        - Security / privacy
        - Packaging / distribution
        - Accessibility
        - Documentation
        - Developer experience

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, provider documentation, or examples from other clients.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am willing to help test or implement this.
          required: false
